d-column:1/-1}.item{padding:13px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;align-items:center}.item:last-child{border:0}.pill{display:inline-block;background:#f6edda;color:#7e5c1f;border-radius:20px;padding:4px 9px;font-size:12px}.chat{height:340px;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:14px;background:#f7f9fd;border-radius:12px;margin-bottom:12px}.bubble{max-width:85%;padding:12px;border-radius:13px;background:white;white-space:pre-wrap}.bubble.me{align-self:flex-end;background:#dce9fb}.bubble.bot{align-self:flex-start;border:1px solid var(--line)}.chatinput{display:flex;gap:8px}.chatinput input{flex:1}.hidden{display:none!important}.notice{background:#fff9ec;border-left:3px solid var(--gold);padding:12px;border-radius:7px}.settings{max-width:640px}#toast{position:fixed;bottom:18px;right:18px;background:#152e56;color:white;padding:14px;border-radius:12px;display:none;max-width:350px;z-index:5}button:disabled{opacity:.5;cursor:not-allowed}@media(max-width:700px){header{padding:13px}header h1{font-size:17px}.layout{display:block;min-height:0}aside{padding:8px;overflow:auto}nav{display:flex;min-width:max-content}nav button{white-space:nowrap;padding:10px}main{padding:12px}.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}.panel{padding:15px}.chat{height:48vh}.item{align-items:flex-start;flex-direction:column}}

:root{--navy:#9b5376;--gold:#c99b6b;--bg:#fff7fa;--line:#f0dce5;--text:#503b49}
body{background:radial-gradient(circle at 95% 5%,#f9dce8 0,transparent 30%),linear-gradient(145deg,#fff9fb,#fdf1f6 55%,#fffafc);min-height:100vh}

</style></head><body><header><div class="row"><span class="mark">V</span><div><h1>VELOTEC ASSISTENTE</h1><small>Sua agenda e lembretes pessoais</small></div></div><span id="status">Modo local</span></header><div class="layout"><aside><nav id="nav"></nav></aside><main><div id="view"></div></main></div><div id="toast"></div>
<script>
const K='velotec-assistente-v1';let dbData=readLocal(),tab='Início',cloudSave=null,recognition=null;let voiceEnabled=false;
function readLocal(){try{let d=JSON.parse(localStorage.getItem(K));if(Array.isArray(d?.items))return d}catch(e){}return {items:[]}}
function save(){localStorage.setItem(K,JSON.stringify(dbData));if(tab!=='Conversar')render();if(cloudSave)cloudSave()}
const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');const localDate=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>localDate(new Date());const now=()=>new Date();
function when(i){return new Date(i.date+'T'+(i.time||'09:00')+':00')}
function occurs(i,date){if(i.done&&!i.repeat)return false;if(i.repeat==='daily')return date>=i.date;if(i.repeat==='weekly'){let a=new Date(i.date+'T12:00'),b=new Date(date+'T12:00');return date>=i.date&&Math.round((b-a)/86400000)%7===0}return i.date===date}
function upcoming(date){return dbData.items.filter(i=>occurs(i,date)).sort((a,b)=>a.time.localeCompare(b.time))}
function categoryIcon(t){return ({med:'💊',event:'📅',task:'✅',note:'📝'})[t]||'🔔'}
const navs=[['Início','⌂'],['Conversar','✦'],['Agenda','▦'],['Lembretes','♧'],['Medicamentos','✚'],['Anotações','✎'],['Configurações','⚙']];
function navTo(t){tab=t;render()}
function render(){document.getElementById('nav').innerHTML=navs.map(([t,i])=>`<button class="${tab===t?'active':''}" onclick="navTo('${t}')">${i} &nbsp; ${t}</button>`).join('');let v='';
if(tab==='Início'){let a=upcoming(today());v=`<h2>Olá! Como posso ajudar hoje? 💙</h2><div class="grid"><div class="metric">Compromissos hoje<b>${a.length}</b></div><div class="metric">Medicamentos hoje<b>${a.filter(x=>x.type==='med').length}</b></div><div class="metric">Lembretes cadastrados<b>${dbData.items.length}</b></div></div><div class="panel" style="margin-top:17px"><div class="row between"><h2>Minha agenda de hoje</h2><button class="primary" onclick="navTo('Conversar')">🎙 Conversar</button></div>${itemsHtml(a)||'<p class="muted">Nenhum compromisso para hoje.</p>'}</div><div class="panel"><h3>Cadastro rápido</h3>${formHtml()}</div>`}
if(tab==='Conversar'){v=`<div class="panel"><h2>✦ Converse com sua assistente</h2><p class="muted">Pergunte sobre qualquer data, consulte compromissos ou peça alterações por texto ou voz.</p><div class="chat" id="chat"><div class="bubble bot">Olá! Você pode dizer: “Me lembra de levar os documentos amanhã às 8 horas” ou “O que tenho hoje?”.</div></div><form class="chatinput" onsubmit="sendChat(event)"><input id="chatText" placeholder="Escreva ou fale comigo..." required autocomplete="off"><button type="button" class="secondary" onclick="startMic()" title="Falar">🎙</button><button class="primary">Enviar</button></form><p class="muted" style="font-size:12px">Reconhecimento de voz depende do navegador. Consultas por data, período, assunto e pessoa; confirma antes de alterar ou excluir. Não é uma IA geral.</p></div>`}
if(tab==='Agenda'){let d=window.selectedDate||today();v=`<div class="panel"><div class="row between"><h2>Agenda inteligente</h2><button class="primary" onclick="newItem()">＋ Novo compromisso</button></div><label class="field" style="max-width:250px">Escolha a data<input type="date" value="${d}" onchange="window.selectedDate=this.value;render()"></label>${itemsHtml(upcoming(d))||'<p class="muted">Nenhum registro nesta data.</p>'}</div>`}
if(['Lembretes','Medicamentos','Anotações'].includes(tab)){let type=tab==='Medicamentos'?'med':tab==='Anotações'?'note':null;let a=dbData.items.filter(i=>type?i.type===type:i.type!=='med'&&i.type!=='note').sort((a,b)=>a.date.localeCompare(b.date));v=`<div class="panel"><div class="row between"><h2>${tab}</h2><button class="primary" onclick="newItem('${type||'task'}')">＋ Cadastrar</button></div>${itemsHtml(a)||'<p class="muted">Nenhum registro cadastrado.</p>'}</div>`}
if(tab==='Configurações'){v=`<div class="panel settings"><h2>Configurações</h2><p><b>Sincronização:</b> <span id="syncDescription">Os registros ficam salvos neste navegador até conectar o Firebase.</span></p><div class="row"><button class="primary" id="loginBtn" onclick="window.firebaseLogin?.()">Entrar com Google</button><button class="secondary" id="logoutBtn" onclick="window.firebaseLogout?.()">Sair</button></div><p class="muted">Para sincronizar entre aparelhos, configure um projeto Firebase no código, com Authentication e Firestore habilitados.</p><hr><label class="row"><input type="checkbox" style="width:auto" ${voiceEnabled?'checked':''} onchange="voiceEnabled=this.checked;localStorage.setItem('va-voice',voiceEnabled?'1':'0')"> Ler respostas em voz alta</label><p><button class="secondary" onclick="requestNotifications()">🔔 Permitir notificações neste aparelho</button></p><div class="notice">Nesta versão, alertas locais só podem ser verificados enquanto o aplicativo está aberto. Para notificações garantidas com o app fechado é necessário configurar envio push no servidor (FCM e agendamento). Para medicamentos, mantenha também um alarme confiável.</div><p><button class="secondary" onclick="exportData()">Exportar cópia dos dados</button></p></div>`}
document.getElementById('view').innerHTML=v;let st=document.getElementById('status');st.textContent=window.cloudUser?'☁️ Sincronizado':'Modo local';if(tab==='Configurações'&&window.cloudUser)document.getElementById('syncDescription').textContent='Conectado como '+window.cloudUser.email}
function itemsHtml(a){return a.map(i=>`<div class="item"><div><div><b>${categoryIcon(i.type)} ${safe(i.title)}</b> ${i.done?'<span class="pill">Concluído</span>':''}</div><div class="muted">${i.date.split('-').reverse().join('/')} ${safe(i.time)} ${i.repeat!=='none'?'· '+(i.repeat==='daily'?'Todos os dias':'Toda semana'):''}</div>${i.detail?`<div>${safe(i.detail)}</div>`:''}</div><div class="row"><button class="secondary" onclick="editItem('${i.id}')">Editar</button><button class="secondary" onclick="markDone('${i.id}')">${i.done?'Reabrir':'Concluir'}</button><button class="secondary danger" onclick="deleteItem('${i.id}')">Excluir</button></div></div>`).join('')}
function formHtml(i={}){return `<form onsubmit="submitItem(event,'${i.id||''}')"><div class="formgrid"><label class="field wide">O que deseja lembrar?<input name="title" required maxlength="180" value="${safe(i.title||'')}" placeholder="Ex.: Consulta, tomar medicamento, pagar conta"></label><label class="field">Categoria<select name="type">${[['event','Compromisso'],['task','Lembrete / tarefa'],['med','Medicamento'],['note','Anotação']].map(([k,n])=>`<option value="${k}" ${i.type===k?'selected':''}>${n}</option>`).join('')}</select></label><label class="field">Data<input name="date" type="date" required value="${i.date||today()}"></label><label class="field">Horário<input name="time" type="time" required value="${i.time||'09:00'}"></label><label class="field">Repetição<select name="repeat">${[['none','Não repetir'],['daily','Todos os dias'],['weekly','Toda semana']].map(([k,n])=>`<option value="${k}" ${i.repeat===k?'selected':''}>${n}</option>`).join('')}</select></label><label class="field wide">Observações<textarea name="detail" placeholder="Detalhes opcionais">${safe(i.detail||'')}</textarea></label></div><div class="row"><button class="primary">Salvar na agenda</button>${i.id?'<button type="button" class="secondary" onclick="render()">Cancelar</button>':''}</div></form>`}
function newItem(type='event'){tab='Agenda';document.getElementById('view').innerHTML=`<div class="panel"><h2>Novo cadastro</h2>${formHtml({type})}</div>`}
function editItem(id){let i=dbData.items.find(x=>x.id===id);if(i)document.getElementById('view').innerHTML=`<div class="panel"><h2>Editar registro</h2>${formHtml(i)}</div>`}
function submitItem(e,id){e.preventDefault();let f=new FormData(e.target),item={id:id||uid(),title:String(f.get('title')).trim(),type:f.get('type'),date:f.get('date'),time:f.get('time'),repeat:f.get('repeat'),detail:String(f.get('detail')),done:false};if(!item.title)return;let idx=dbData.items.findIndex(x=>x.id===id);if(idx>=0)item.done=dbData.items[idx].done,dbData.items[idx]=item;else dbData.items.push(item);save();tab='Agenda';render();toast('Registro salvo na agenda!')}
function deleteItem(id){if(!confirm('Excluir este registro?'))return;dbData.items=dbData.items.filter(x=>x.id!==id);save()}
function markDone(id){let i=dbData.items.find(x=>x.id===id);if(i){i.done=!i.done;save()}}
function toast(s){let el=document.getElementById('toast');el.textContent=s;el.style.display='block';setTimeout(()=>el.style.display='none',4500)}
function speak(s){if(voiceEnabled&&'speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='pt-BR';speechSynthesis.speak(u)}}
function addBubble(s,who){let c=document.getElementById('chat');if(!c)return;let d=document.createElement('div');d.className='bubble '+who;d.textContent=s;c.appendChild(d);c.scrollTop=c.scrollHeight}
// Interpretador local, sem API ou custo externo.
const meses={janeiro:1,fevereiro:2,marco:3,abril:4,maio:5,junho:6,julho:7,agosto:8,setembro:9,outubro:10,novembro:11,dezembro:12};
const diasSemana={domingo:0,segunda:1,terca:2,quarta:3,quinta:4,sexta:5,sabado:6};
let pendingChat=null,lastChatItemId=null,lastChatQuery=null;
const normalizeText=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const formatDate=x=>String(x).split('-').reverse().join('/');
function parseDateFromText(raw,{future=false}={}){
 const s=normalizeText(raw),base=new Date(),yearNow=base.getFullYear();base.setHours(12,0,0,0);
 const mk=(day,month,year)=>{const d=new Date(year,month-1,day,12);return d.getDate()===day&&d.getMonth()===month-1&&d.getFullYear()===year?localDate(d):null};
 let m=s.match(/\b(?:dia\s+)?(\d{1,2})\s*(?:\/|\-|\s+de\s+)(\d{1,2}|janeiro|fevereiro|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)(?:\s*(?:\/|\-|\s+de\s+)(\d{4}))?\b/);
 if(m){let day=+m[1],month=meses[m[2]]||+m[2],year=m[3]?+m[3]:yearNow,date=mk(day,month,year);if(!date)return {error:'Essa data não existe. Pode conferir?'};if(future&&!m[3]&&date<today())date=mk(day,month,year+1);return {date,explicit:true}}
 if(/depois de amanha/.test(s)){base.setDate(base.getDate()+2);return {date:localDate(base),explicit:true}}
 if(/\bamanha\b/.test(s)){base.setDate(base.getDate()+1);return {date:localDate(base),explicit:true}}
 if(/\bhoje\b/.test(s))return {date:localDate(base),explicit:true};
 if(/\b(proxima semana|semana que vem|essa semana|esta semana|semana atual)\b/.test(s)){
  const delta=(base.getDay()+6)%7;base.setDate(base.getDate()-delta+(/proxima semana|semana que vem/.test(s)?7:0));let start=localDate(base);base.setDate(base.getDate()+6);return {start,end:localDate(base),explicit:true};
 }
 if(/\b(esse mes|este mes|mes atual|proximo mes|mes que vem)\b/.test(s)){
  const next=/proximo mes|mes que vem/.test(s)?1:0;let a=new Date(yearNow,base.getMonth()+next,1,12),b=new Date(a.getFullYear(),a.getMonth()+1,0,12);return {start:localDate(a),end:localDate(b),explicit:true};
 }
 m=s.match(/\b(?:na\s+)?(proxima\s+)?(segunda|terca|quarta|quinta|sexta|sabado|domingo)(?:-feira)?\b/);
 if(m){let delta=(diasSemana[m[2]]-base.getDay()+7)%7;if(delta===0||m[1])delta+=delta===0?7:0;base.setDate(base.getDate()+delta);return {date:localDate(base),explicit:true}}
 m=s.match(/\b(?:dia\s+)(\d{1,2})\b/);
 if(m){let day=+m[1],d=new Date(yearNow,base.getMonth(),day,12);if(d.getDate()!==day)return {error:'Essa data não existe neste mês.'};if(future&&localDate(d)<today())d=new Date(yearNow,base.getMonth()+1,day,12);return {date:localDate(d),explicit:true}}
 m=s.match(/\b(?:em|de|para)\s+(janeiro|fevereiro|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)(?:\s+de\s+(\d{4}))?\b/);
 if(m){let month=meses[m[1]],year=m[2]?+m[2]:yearNow;return {start:`${year}-${pad(month)}-01`,end:localDate(new Date(year,month,0,12)),explicit:true}}
 return {date:today(),explicit:false};
}
function parseTimeFromText(raw){const s=normalizeText(raw);let m=s.match(/\b(?:as|a|para as|pras|pelas)\s*(\d{1,2})(?:[:h](\d{1,2}))?\s*(?:horas?|hrs?)?\b/);if(!m)m=s.match(/\b(\d{1,2})[:h](\d{2})\b/);if(!m)return null;let h=+m[1],min=+(m[2]||0);return h<24&&min<60?pad(h)+':'+pad(min):'invalid'}
function parseOffsets(raw){const s=normalizeText(raw),offsets=[];
 const add=n=>{if(Number.isFinite(n)&&n>=0&&!offsets.includes(n))offsets.push(n)};
 for(const m of s.matchAll(/(?:\b(\d+)\s*(dias?|horas?|minutos?)\s*antes\b|\bantes\s*(?:de|das?)?\s*(\d+)\s*(dias?|horas?|minutos?)\b)/g)){
  const n=+(m[1]||m[3]),unit=m[2]||m[4];add(n*(unit.startsWith('dia')?1440:unit.startsWith('hora')?60:1));
 }
 if(/\b(um|uma)\s+dia\s+antes\b/.test(s))add(1440);
 if(/\b(uma|um)\s+hora\s+antes\b/.test(s))add(60);
 if(/\b(na hora|no horario|no momento)\b/.test(s))add(0);
 return offsets.sort((a,b)=>b-a);
}
function cleanTitle(raw){return raw.replace(/^(?:oi\s+)?(?:velotec[,!]?\s*)?(?:(?:por favor[, ]*)?)(?:me\s+)?(?:lembre|lembra|lembrar|agende|agenda|marque|marca|cadastre|cadastra|anote|anota)\s*(?:-me)?\s*(?:de|que|para)?\s*/i,'')
 .replace(/\b(?:dia\s*)?\d{1,2}\s*(?:\/|\-|\s+de\s+)(?:\d{1,2}|janeiro|fevereiro|março|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)(?:\s*(?:\/|\-|\s+de\s+)\d{4})?\b/gi,'')
 .replace(/\b(?:hoje|amanhã|depois de amanhã|próxima semana|semana que vem)\b/gi,'')
 .replace(/(?:às|as)\s*\d{1,2}(?:[:h]\d{1,2})?\s*(?:horas?)?/gi,'')
 .replace(/\b(?:me\s+)?(?:avise|avisa|lembre|lembra)\s+(?:um|uma|dois|duas|\d+)\s*(?:dias?|horas?|minutos?)\s*antes.*$/i,'')
 .replace(/\b(?:me\s+)?(?:avise|avisa|lembre|lembra)\s+(?:na hora|no horário).*$/i,'')
 .replace(/\b(?:todos os dias|todo dia|diariamente|toda semana|semanalmente)\b/gi,'')
 .replace(/\s+/g,' ').replace(/^[\s,.:;-]+|[\s,.:;-]+$/g,'').trim()}
function matchesPeriod(i,p){if(p.start)return i.date<=p.end&&(i.repeat==='daily'||i.repeat==='weekly'||i.date>=p.start);return occurs(i,p.date)}
function searchItems(raw,p){const s=normalizeText(raw);let type=/medicamento|remedio|comprimido/.test(s)?'med':/consulta/.test(s)?'consulta':/reuniao/.test(s)?'reuniao':null;

 if(!items.length)return `Não encontrei compromissos cadastrados ${label} com esses critérios.`;
 let lines=items.slice(0,35).map(i=>`${formatDate(i.date)} às ${i.time} — ${i.title}${i.repeat!=='none'?' (recorrente)':''}`);

function identifyItem(raw){let s=normalizeText(raw);const date=parseDateFromText(raw),all=dbData.items.filter(i=>!i.done||i.repeat);

 if(topic)candidates=candidates.filter(i=>normalizeText(i.title).includes(topic[0].split(' ')[0]));

 if(!date.explicit&&!topic&&lastChatItemId){let item=all.find(i=>i.id===lastChatItemId);if(item)return {item}}
 if(candidates.length>1)return {error:`Encontrei ${candidates.length} registros possíveis. Diga o nome e a data do compromisso para eu identificar o correto.`};

 if(pendingChat){
  if(/^(nao|não|cancela|cancelar|desiste|deixa pra la)\b/.test(s)){pendingChat=null;return 'Tudo bem, não alterei nada.'}
  if(/^(sim|confirmo|pode|ok|isso|salvar|confirma)\b/.test(s)){

   if(action.kind==='create'){dbData.items.push(action.item);lastChatItemId=action.item.id;save();return `Pronto! Cadastrei ${describeItem(action.item)}.`}
   if(action.kind==='delete'){dbData.items=dbData.items.filter(i=>i.id!==action.id);save();lastChatItemId=null;return 'Compromisso excluído com sua confirmação.'}
   if(action.kind==='edit'){let idx=dbData.items.findIndex(i=>i.id===action.id);if(idx<0)return 'Esse compromisso não está mais cadastrado.';dbData.items[idx]={...dbData.items[idx],...action.patch};lastChatItemId=action.id;save();return `Atualizei: ${describeItem(dbData.items[idx])}.`}

 }

// Mantém o alerta visual e tenta a notificação pelo service worker no Android.
const notified=new Set();
async function showDueNotification(item, stamp){
 const title='🔔 Velotec Assistente';
 const options={body:item.title+' — '+item.time,tag:'velotec-'+stamp.replace(/[^a-zA-Z0-9_-]/g,'-'),icon:'./icon-192.png',badge:'./icon-192.png',renotify:false};

  if('serviceWorker' in navigator){
   const reg=await navigator.serviceWorker.ready;
   if(reg&&typeof reg.showNotification==='function'){
    await reg.showNotification(title,options);
    return;
   }
  }
  new Notification(title,options);
 }catch(e){
  console.warn('Falha ao exibir notificação:',e);
  toast('Não foi possível exibir a notificação do Android. Confira as permissões.');
 }
}
function checkDue(){
 const d=new Date(),date=localDate(d);
 for(const i of upcoming(date)){
  if(i.done||!/^\d{2}:\d{2}$/.test(i.time||''))continue;
  const stamp=date+':'+i.id;
  if(notified.has(stamp))continue;
  const due=new Date(date+'T'+i.time+':00');
  const delay=d.getTime()-due.getTime();
  // Janela de tolerância: aceita até 2 minutos de atraso enquanto o app executa.
  if(delay<0||delay>120000)continue;
  notified.add(stamp);
  toast('🔔 '+i.title);
  showDueNotification(i,stamp);
 }
}
// Avisos adicionais: executados somente enquanto a página estiver em execução.
function checkExtraAlerts(){

 for(const i of dbData.items){
  if(i.done||!Array.isArray(i.alertOffsets)||!i.alertOffsets.length||!i.date||!i.time)continue;
  const base=new Date(i.date+'T'+i.time+':00').getTime();if(!Number.isFinite(base))continue;
  for(const offset of i.alertOffsets){
   if(offset===0)continue; // aviso no horário já é emitido por checkDue
   if(!Number.isFinite(offset)||offset<0)continue;
   const due=base-offset*60000,delay=nowMs-due,stamp='extra:'+i.id+':'+offset+':'+i.date;

    notified.add(stamp);toast('🔔 '+i.title);showDueNotification(i,stamp);
   }
  }
 }
}
