<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142e5d"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png"><title>Velotec Assistente</title><style>
:root{--navy:#142e5d;--gold:#c9a75c;--bg:#f5f7fb;--line:#dfe6f0;--text:#1e2c44}*{box-sizing:border-box}body{margin:0;font:15px system-ui,Arial;color:var(--text);background:var(--bg)}button,input,textarea,select{font:inherit}button{cursor:pointer}header{background:linear-gradient(120deg,#0d2148,#234e88);color:white;padding:18px 24px;display:flex;align-items:center;gap:14px;justify-content:space-between}header h1{margin:0;font-size:21px;letter-spacing:1px}header small{color:#e4d6b5}.mark{color:var(--gold);font:bold 38px Georgia}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 85px)}aside{background:white;border-right:1px solid var(--line);padding:18px 12px}nav{display:grid;gap:7px}nav button{border:0;background:transparent;text-align:left;border-radius:10px;padding:13px;color:var(--text)}nav button.active,nav button:hover{background:#e9eff9;color:#143f7d}main{padding:24px;max-width:1150px;width:100%;margin:auto}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:17px;box-shadow:0 2px 14px #173a6810}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.metric{background:#edf3fc;border-radius:12px;padding:17px}.metric b{display:block;font-size:27px;color:var(--navy)}h2{margin:0 0 14px;font-size:21px}h3{margin:0 0 10px;font-size:16px}.muted{color:#69788e}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.primary{border:0;background:var(--navy);color:white;border-radius:10px;padding:11px 15px}.secondary{border:1px solid var(--line);background:white;border-radius:10px;padding:10px 13px;color:var(--navy)}.danger{color:#a53644}.field{display:grid;gap:5px;margin-bottom:11px;font-weight:600;font-size:13px}input,textarea,select{padding:11px;border:1px solid #cfd9e7;border-radius:9px;width:100%;background:white;color:var(--text)}textarea{min-height:72px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}.wide{grid-column:1/-1}.item{padding:13px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;align-items:center}.item:last-child{border:0}.pill{display:inline-block;background:#f6edda;color:#7e5c1f;border-radius:20px;padding:4px 9px;font-size:12px}.chat{height:340px;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:14px;background:#f7f9fd;border-radius:12px;margin-bottom:12px}.bubble{max-width:85%;padding:12px;border-radius:13px;background:white;white-space:pre-wrap}.bubble.me{align-self:flex-end;background:#dce9fb}.bubble.bot{align-self:flex-start;border:1px solid var(--line)}.chatinput{display:flex;gap:8px}.chatinput input{flex:1}.hidden{display:none!important}.notice{background:#fff9ec;border-left:3px solid var(--gold);padding:12px;border-radius:7px}.settings{max-width:640px}#toast{position:fixed;bottom:18px;right:18px;background:#152e56;color:white;padding:14px;border-radius:12px;display:none;max-width:350px;z-index:5}button:disabled{opacity:.5;cursor:not-allowed}@media(max-width:700px){header{padding:13px}header h1{font-size:17px}.layout{display:block;min-height:0}aside{padding:8px;overflow:auto}nav{display:flex;min-width:max-content}nav button{white-space:nowrap;padding:10px}main{padding:12px}.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}.panel{padding:15px}.chat{height:48vh}.item{align-items:flex-start;flex-direction:column}}
</style></head><body><header><div class="row"><span class="mark">V</span><div><h1>VELOTEC ASSISTENTE</h1><small>Sua agenda e lembretes pessoais</small></div></div><span id="status">Modo local</span></header><div class="layout"><aside><nav id="nav"></nav></aside><main><div id="view"></div></main></div><div id="toast"></div>
<script>
const K='velotec-assistente-v1';let dbData=readLocal(),tab='Início',cloudSave=null,recognition=null;let voiceEnabled=false;
function readLocal(){try{let d=JSON.parse(localStorage.getItem(K));if(Array.isArray(d?.items))return d}catch(e){}return {items:[]}}
function save(){localStorage.setItem(K,JSON.stringify(dbData));render();if(cloudSave)cloudSave()}
const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');const localDate=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>localDate(new Date());const now=()=>new Date();
function when(i){return new Date(i.date+'T'+(i.time||'09:00')+':00')}
function occurs(i,date){if(i.done&&!i.repeat)return false;if(i.repeat==='daily')return date>=i.date;if(i.repeat==='weekly'){let a=new Date(i.date+'T12:00'),b=new Date(date+'T12:00');return date>=i.date&&Math.round((b-a)/86400000)%7===0}return i.date===date}
function upcoming(date){return dbData.items.filter(i=>occurs(i,date)).sort((a,b)=>a.time.localeCompare(b.time))}
function categoryIcon(t){return ({med:'💊',event:'📅',task:'✅',note:'📝'})[t]||'🔔'}
const navs=[['Início','⌂'],['Conversar','✦'],['Agenda','▦'],['Lembretes','♧'],['Medicamentos','✚'],['Anotações','✎'],['Configurações','⚙']];
function navTo(t){tab=t;render()}
function render(){document.getElementById('nav').innerHTML=navs.map(([t,i])=>`<button class="${tab===t?'active':''}" onclick="navTo('${t}')">${i} &nbsp; ${t}</button>`).join('');let v='';
if(tab==='Início'){let a=upcoming(today());v=`<h2>Olá! Como posso ajudar hoje? 💙</h2><div class="grid"><div class="metric">Compromissos hoje<b>${a.length}</b></div><div class="metric">Medicamentos hoje<b>${a.filter(x=>x.type==='med').length}</b></div><div class="metric">Lembretes cadastrados<b>${dbData.items.length}</b></div></div><div class="panel" style="margin-top:17px"><div class="row between"><h2>Minha agenda de hoje</h2><button class="primary" onclick="navTo('Conversar')">🎙 Conversar</button></div>${itemsHtml(a)||'<p class="muted">Nenhum compromisso para hoje.</p>'}</div><div class="panel"><h3>Cadastro rápido</h3>${formHtml()}</div>`}
if(tab==='Conversar'){v=`<div class="panel"><h2>✦ Converse com sua assistente</h2><p class="muted">Peça para cadastrar, consultar ou organizar seus lembretes por texto ou voz.</p><div class="chat" id="chat"><div class="bubble bot">Olá! Você pode dizer: “Me lembra de levar os documentos amanhã às 8 horas” ou “O que tenho hoje?”.</div></div><form class="chatinput" onsubmit="sendChat(event)"><input id="chatText" placeholder="Escreva ou fale comigo..." required autocomplete="off"><button type="button" class="secondary" onclick="startMic()" title="Falar">🎙</button><button class="primary">Enviar</button></form><p class="muted" style="font-size:12px">Reconhecimento de voz depende do navegador. Esta versão interpreta comandos de agenda; não é uma IA conversacional geral.</p></div>`}
if(tab==='Agenda'){let d=window.selectedDate||today();v=`<div class="panel"><div class="row between"><h2>Agenda inteligente</h2><button class="primary" onclick="newItem()">＋ Novo compromisso</button></div><label class="field" style="max-width:250px">Escolha a data<input type="date" value="${d}" onchange="window.selectedDate=this.value;render()"></label>${itemsHtml(upcoming(d))||'<p class="muted">Nenhum registro nesta data.</p>'}</div>`}
if(['Lembretes','Medicamentos','Anotações'].includes(tab)){let type=tab==='Medicamentos'?'med':tab==='Anotações'?'note':null;let a=dbData.items.filter(i=>type?i.type===type:i.type!=='med'&&i.type!=='note').sort((a,b)=>a.date.localeCompare(b.date));v=`<div class="panel"><div class="row between"><h2>${tab}</h2><button class="primary" onclick="newItem('${type||'task'}')">＋ Cadastrar</button></div>${itemsHtml(a)||'<p class="muted">Nenhum registro cadastrado.</p>'}</div>`}
if(tab==='Configurações'){v=`<div class="panel settings"><h2>Configurações</h2><p><b>Sincronização:</b> <span id="syncDescription">Os registros ficam salvos neste navegador até conectar o Firebase.</span></p><div class="row"><button class="primary" id="loginBtn" onclick="window.firebaseLogin?.()">Entrar com Google</button><button class="secondary" id="logoutBtn" onclick="window.firebaseLogout?.()">Sair</button></div><p class="muted">Para sincronizar entre aparelhos, configure um projeto Firebase no código, com Authentication e Firestore habilitados.</p><hr><label class="row"><input type="checkbox" style="width:auto" ${voiceEnabled?'checked':''} onchange="voiceEnabled=this.checked;localStorage.setItem('va-voice',voiceEnabled?'1':'0')"> Ler respostas em voz alta</label><p><button class="secondary" onclick="requestNotifications()">🔔 Permitir notificações neste aparelho</button></p><div class="notice">Nesta versão, alertas locais só podem ser verificados enquanto o aplicativo está aberto. Para notificações garantidas com o app fechado é necessário configurar envio push no servidor (FCM e agendamento). Para medicamentos, mantenha também um alarme confiável.</div><p><button class="secondary" onclick="exportData()">Exportar cópia dos dados</button></p></div>`}
document.getElementById('view').innerHTML=v;let st=document.getElementById('status');st.textContent=window.cloudUser?'☁️ Sincronizado':'Modo local';if(tab==='Configurações'&&window.cloudUser)document.getElementById('syncDescription').textContent='Conectado como '+window.cloudUser.email}
function itemsHtml(a){return a.map(i=>`<div class="item"><div><div><b>${categoryIcon(i.type)} ${safe(i.title)}</b> ${i.done?'<span class="pill">Concluído</span>':''}</div><div class="muted">${i.date.split('-').reverse().join('/')} ${safe(i.time)} ${i.repeat!=='none'?'· '+(i.repeat==='daily'?'Todos os dias':'Toda semana'):''}</div>${i.detail?`<div>${safe(i.detail)}</div>`:''}</div><div class="row"><button class="secondary" onclick="editItem('${i.id}')">Editar</button><button class="secondary" onclick="markDone('${i.id}')">${i.done?'Reabrir':'Concluir'}</button><button class="secondary danger" onclick="deleteItem('${i.id}')">Excluir</button></div></div>`).join('')}
function formHtml(i={}){return `<form onsubmit="submitItem(event,'${i.id||''}')"><div class="formgrid"><label class="field wide">O que deseja lembrar?<input name="title" required maxlength="180" value="${safe(i.title||'')}" placeholder="Ex.: Consulta, tomar medicamento, pagar conta"></label><label class="field">Categoria<select name="type">${[['event','Compromisso'],['task','Lembrete / tarefa'],['med','Medicamento'],['note','Anotação']].map(([k,n])=>`<option value="${k}" ${i.type===k?'selected':''}>${n}</option>`).join('')}</select></label><label class="field">Data<input name="date" type="date" required value="${i.date||today()}"></label><label class="field">Horário<input name="time" type="time" required value="${i.time||'09:00'}"></label><label class="field">Repetição<select name="repeat">${[['none','Não repetir'],['daily','Todos os dias'],['weekly','Toda semana']].map(([k,n])=>`<option value="${k}" ${i.repeat===k?'selected':''}>${n}</option>`).join('')}</select></label><label class="field wide">Observações<textarea name="detail" placeholder="Detalhes opcionais">${safe(i.detail||'')}</textarea></label></div><div class="row"><button class="primary">Salvar na agenda</button>${i.id?'<button type="button" class="secondary" onclick="render()">Cancelar</button>':''}</div></form>`}
function newItem(type='event'){tab='Agenda';document.getElementById('view').innerHTML=`<div class="panel"><h2>Novo cadastro</h2>${formHtml({type})}</div>`}
function editItem(id){let i=dbData.items.find(x=>x.id===id);if(i)document.getElementById('view').innerHTML=`<div class="panel"><h2>Editar registro</h2>${formHtml(i)}</div>`}
function submitItem(e,id){e.preventDefault();let f=new FormData(e.target),item={id:id||uid(),title:String(f.get('title')).trim(),type:f.get('type'),date:f.get('date'),time:f.get('time'),repeat:f.get('repeat'),detail:String(f.get('detail')),done:false};if(!item.title)return;let idx=dbData.items.findIndex(x=>x.id===id);if(idx>=0)item.done=dbData.items[idx].done,dbData.items[idx]=item;else dbData.items.push(item);save();tab='Agenda';render();toast('Registro salvo na agenda!')}
function deleteItem(id){if(!confirm('Excluir este registro?'))return;dbData.items=dbData.items.filter(x=>x.id!==id);save()}
function markDone(id){let i=dbData.items.find(x=>x.id===id);if(i){i.done=!i.done;save()}}
function toast(s){let el=document.getElementById('toast');el.textContent=s;el.style.display='block';setTimeout(()=>el.style.display='none',4500)}
function speak(s){if(voiceEnabled&&'speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='pt-BR';speechSynthesis.speak(u)}}
function addBubble(s,who){let c=document.getElementById('chat');if(!c)return;let d=document.createElement('div');d.className='bubble '+who;d.textContent=s;c.appendChild(d);c.scrollTop=c.scrollHeight}
function dayFromWord(s){let d=new Date();if(/\bamanh[ãa]\b/.test(s))d.setDate(d.getDate()+1);else if(/\bdepois de amanh[ãa]\b/.test(s))d.setDate(d.getDate()+2);return localDate(d)}
function parseCommand(raw){let s=raw.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');let date=dayFromWord(s);let explicit=s.match(/\b(?:dia\s*)?(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?\b/);if(explicit){let year=explicit[3]?Number(explicit[3]):new Date().getFullYear();if(year<100)year+=2000;let d=new Date(year,Number(explicit[2])-1,Number(explicit[1]));if(d.getDate()!==Number(explicit[1])||d.getMonth()!==Number(explicit[2])-1)return {error:'Essa data não existe. Pode conferir?'};date=localDate(d)}else{let match=s.match(/\bdia\s+(\d{1,2})\b/);if(match){let d=new Date(),n=Number(match[1]);d.setDate(1);d.setDate(n);if(d<new Date(today()+'T00:00:00'))d.setMonth(d.getMonth()+1);date=localDate(d)}}
let tm=s.match(/\b(?:as|a)\s*(\d{1,2})(?:[:h](\d{2}))?\s*(?:horas?|h)?\b/);let time=tm?pad(Number(tm[1]))+':'+pad(Number(tm[2]||0)):null;if(tm&&(Number(tm[1])>23||Number(tm[2]||0)>59))return {error:'O horário informado não é válido.'};
let repeat=/todos os dias|todo dia|diariamente/.test(s)?'daily':/toda (segunda|terca|quarta|quinta|sexta|sabado|domingo)|toda semana|semanalmente/.test(s)?'weekly':'none';
if(/o que (tenho|tem)|minha agenda|meus compromissos|meus lembretes|quais.*(hoje|amanha)/.test(s)){return {query:true,date:/amanha/.test(s)?dayFromWord('amanha'):date}}
if(/lembra|lembrete|agenda|marca|cadastra|anota|tenho|tomar|remedio|medicamento|consulta|reuniao/.test(s)){let title=raw.replace(/^(me\s+)?(lembra|lembre|agende|agenda|marca|marque|cadastra|cadastre|anota|anote)(-me)?\s*(de|que|para)?\s*/i,'').replace(/\b(amanhã|hoje|depois de amanhã)\b/gi,'').replace(/\b(?:às|as)\s*\d{1,2}(?:[:h]\d{2})?\s*(?:horas?)?/gi,'').replace(/\b(?:dia\s*)?\d{1,2}[\/\-]\d{1,2}(?:[\/\-]\d{2,4})?\b/gi,'').replace(/\bdia\s+\d{1,2}\b/gi,'').replace(/\b(todos os dias|todo dia|diariamente|toda semana|semanalmente)\b/gi,'').trim().replace(/[.,]+$/,'').trim();return {create:true,title,date,time,repeat,type:/remedio|medicamento|comprimido|tomar/i.test(raw)?'med':'event'}}
return {unknown:true}}
function sendChat(e){e.preventDefault();let inp=document.getElementById('chatText'),raw=inp.value.trim();if(!raw)return;inp.value='';addBubble(raw,'me');let cmd=parseCommand(raw),answer='';
if(cmd.query){let list=upcoming(cmd.date);answer=list.length?'Você tem '+list.length+' registro(s):\n'+list.map(x=>`${x.time} — ${x.title}`).join('\n'):'Não encontrei compromissos para essa data.'}
else if(cmd.create){if(!cmd.time){answer='Qual horário? Para cadastrar com segurança, diga novamente incluindo o horário, por exemplo: “Me lembra de levar documentos amanhã às 8 horas”.'}else if(!cmd.title){answer='O que você quer que eu registre?'}else{let item={id:uid(),title:cmd.title,date:cmd.date,time:cmd.time,repeat:cmd.repeat,type:cmd.type,detail:'Cadastrado pela conversa',done:false};dbData.items.push(item);save();answer=`Registrei na agenda: ${item.title}, ${item.date.split('-').reverse().join('/')} às ${item.time}${item.repeat!=='none'?', com repetição':''}.`}}
else answer=cmd.error||'Posso cadastrar lembretes e consultar sua agenda. Experimente: “Me lembra de levar os documentos amanhã às 8 horas”.';
addBubble(answer,'bot');speak(answer)}
function startMic(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){toast('Este navegador não oferece reconhecimento de voz. Use o campo de texto ou Chrome no Android.');return}recognition=new R();recognition.lang='pt-BR';recognition.interimResults=false;recognition.onresult=e=>{let inp=document.getElementById('chatText');if(inp)inp.value=e.results[0][0].transcript};recognition.onerror=e=>toast('Não consegui ouvir: '+e.error);recognition.start()}
async function requestNotifications(){
 if(!('Notification' in window)){toast('Este navegador não suporta notificações.');return}
 try{
  const permission=await Notification.requestPermission();
  if(permission==='granted'){
   toast('Notificações permitidas! Faça um teste para daqui a 2 minutos.');
   await navigator.serviceWorker?.ready.catch(()=>null);
  }else toast('Permissão de notificações: '+permission);
 }catch(e){toast('Não foi possível solicitar a permissão: '+e.message)}
}
function exportData(){let blob=new Blob([JSON.stringify(dbData,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='velotec-assistente-backup.json';a.click();URL.revokeObjectURL(a.href)}
// Mantém o alerta visual e tenta a notificação pelo service worker no Android.
const notified=new Set();
async function showDueNotification(item, stamp){
 const title='🔔 Velotec Assistente';
 const options={body:item.title+' — '+item.time,tag:'velotec-'+stamp.replace(/[^a-zA-Z0-9_-]/g,'-'),icon:'./icon-192.png',badge:'./icon-192.png',renotify:false};
 if(!('Notification' in window)||Notification.permission!=='granted'){
  toast('🔔 '+item.title+' (ative as notificações nas Configurações)');
  return;
 }
 try{
  if('serviceWorker' in navigator){
   const reg=await navigator.serviceWorker.ready;
   if(reg&&typeof reg.showNotification==='function'){
    await reg.showNotification(title,options);
    return;
   }
  }
  new Notification(title,options);
 }catch(e){
  console.warn('Falha ao exibir notificação:',e);
  toast('Não foi possível exibir a notificação do Android. Confira as permissões.');
 }
}
function checkDue(){
 const d=new Date(),date=localDate(d);
 for(const i of upcoming(date)){
  if(i.done||!/^\d{2}:\d{2}$/.test(i.time||''))continue;
  const stamp=date+':'+i.id;
  if(notified.has(stamp))continue;
  const due=new Date(date+'T'+i.time+':00');
  const delay=d.getTime()-due.getTime();
  // Janela de tolerância: aceita até 2 minutos de atraso enquanto o app executa.
  if(delay<0||delay>120000)continue;
  notified.add(stamp);
  toast('🔔 '+i.title);
  showDueNotification(i,stamp);
 }
}
voiceEnabled=localStorage.getItem('va-voice')==='1';render();
checkDue();
setInterval(checkDue,5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkDue()});
window.addEventListener('focus',checkDue);
</script>

if(firebaseConfig){try{
 const {initializeApp}=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js');

 const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let unsub=null,ref=null,loading=false;
 window.firebaseLogin=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>toast('Erro no login: '+e.message));
 window.firebaseLogout=()=>signOut(auth);

if ('serviceWorker' in navigator && location.protocol === 'https:') {

  });
