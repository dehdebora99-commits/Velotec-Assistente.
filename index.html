d-column:1/-1}.item{padding:13px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;align-items:center}.item:last-child{border:0}.pill{display:inline-block;background:#f6edda;color:#7e5c1f;border-radius:20px;padding:4px 9px;font-size:12px}.chat{height:340px;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:14px;background:#f7f9fd;border-radius:12px;margin-bottom:12px}.bubble{max-width:85%;padding:12px;border-radius:13px;background:white;white-space:pre-wrap}.bubble.me{align-self:flex-end;background:#dce9fb}.bubble.bot{align-self:flex-start;border:1px solid var(--line)}.chatinput{display:flex;gap:8px}.chatinput input{flex:1}.hidden{display:none!important}.notice{background:#fff9ec;border-left:3px solid var(--gold);padding:12px;border-radius:7px}.settings{max-width:640px}#toast{position:fixed;bottom:18px;right:18px;background:#152e56;color:white;padding:14px;border-radius:12px;display:none;max-width:350px;z-index:5}button:disabled{opacity:.5;cursor:not-allowed}@media(max-width:700px){header{padding:13px}header h1{font-size:17px}.layout{display:block;min-height:0}aside{padding:8px;overflow:auto}nav{display:flex;min-width:max-content}nav button{white-space:nowrap;padding:10px}main{padding:12px}.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}.panel{padding:15px}.chat{height:48vh}.item{align-items:flex-start;flex-direction:column}}

</style></head><body><header><div class="row"><span class="mark">V</span><div><h1>VELOTEC ASSISTENTE</h1><small>Sua agenda e lembretes pessoais</small></div></div><span id="status">Modo local</span></header><div class="layout"><aside><nav id="nav"></nav></aside><main><div id="view"></div></main></div><div id="toast"></div>
<script>
const K='velotec-assistente-v1';let dbData=readLocal(),tab='Início',cloudSave=null,recognition=null;let voiceEnabled=false, pendingDraft=null, aiBusy=false;const APP_CONFIG={functionsBase:'',vapidKey:''}; // Recursos pagos/desativados na versão gratuita
function readLocal(){try{let d=JSON.parse(localStorage.getItem(K));if(Array.isArray(d?.items))return d}catch(e){}return {items:[]}}
function save(){localStorage.setItem(K,JSON.stringify(dbData));render();if(cloudSave)cloudSave()}
const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');const localDate=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>localDate(new Date());const now=()=>new Date();
function when(i){return new Date(i.date+'T'+(i.time||'09:00')+':00')}
function occurs(i,date){if(i.done&&!i.repeat)return false;if(i.repeat==='daily')return date>=i.date;if(i.repeat==='weekly'){let a=new Date(i.date+'T12:00'),b=new Date(date+'T12:00');return date>=i.date&&Math.round((b-a)/86400000)%7===0}return i.date===date}
function upcoming(date){return dbData.items.filter(i=>occurs(i,date)).sort((a,b)=>a.time.localeCompare(b.time))}
function categoryIcon(t){return ({med:'💊',event:'📅',task:'✅',note:'📝'})[t]||'🔔'}
const navs=[['Início','⌂'],['Conversar','✦'],['Agenda','▦'],['Lembretes','♧'],['Medicamentos','✚'],['Anotações','✎'],['Configurações','⚙']];
function navTo(t){tab=t;render()}
function render(){document.getElementById('nav').innerHTML=navs.map(([t,i])=>`<button class="${tab===t?'active':''}" onclick="navTo('${t}')">${i} &nbsp; ${t}</button>`).join('');let v='';
if(tab==='Início'){let a=upcoming(today());v=`<div class="welcome"><div class="eyebrow">Sua rotina em boas mãos</div><h2>Olá! Como posso ajudar hoje? ✨</h2><p>Organize compromissos, medicamentos e lembretes em um só lugar.</p></div><div class="grid"><div class="metric">Compromissos hoje<b>${a.length}</b></div><div class="metric">Medicamentos hoje<b>${a.filter(x=>x.type==='med').length}</b></div><div class="metric">Lembretes cadastrados<b>${dbData.items.length}</b></div></div><div class="panel" style="margin-top:17px"><div class="row between"><h2>Minha agenda de hoje</h2><button class="primary" onclick="navTo('Conversar')">🎙 Conversar</button></div>${itemsHtml(a)||'<p class="muted">Nenhum compromisso para hoje.</p>'}</div><div class="panel"><h3>Cadastro rápido</h3>${formHtml()}</div>`}
if(tab==='Conversar'){v=`<div class="panel"><h2>✦ Converse com sua assistente</h2><p class="muted">Peça para cadastrar, consultar ou organizar seus lembretes por texto ou voz.</p><div class="chat" id="chat"><div class="bubble bot">Olá! Você pode dizer: “Me lembra de levar os documentos amanhã às 8 horas” ou “O que tenho hoje?”.</div></div><form class="chatinput" onsubmit="sendChat(event)"><input id="chatText" placeholder="Escreva ou fale comigo..." required autocomplete="off"><button type="button" class="secondary" onclick="startMic()" title="Falar">🎙</button><button class="primary">Enviar</button></form><p class="muted" style="font-size:12px">Fale ou escreva pedidos de agenda. Esta versão gratuita interpreta padrões comuns e pede confirmação; não é uma IA geral.</p></div>`}
if(tab==='Agenda'){let d=window.selectedDate||today();v=`<div class="panel"><div class="row between"><h2>Agenda inteligente</h2><button class="primary" onclick="newItem()">＋ Novo compromisso</button></div><label class="field" style="max-width:250px">Escolha a data<input type="date" value="${d}" onchange="window.selectedDate=this.value;render()"></label>${itemsHtml(upcoming(d))||'<p class="muted">Nenhum registro nesta data.</p>'}</div>`}
if(['Lembretes','Medicamentos','Anotações'].includes(tab)){let type=tab==='Medicamentos'?'med':tab==='Anotações'?'note':null;let a=dbData.items.filter(i=>type?i.type===type:i.type!=='med'&&i.type!=='note').sort((a,b)=>a.date.localeCompare(b.date));v=`<div class="panel"><div class="row between"><h2>${tab}</h2><button class="primary" onclick="newItem('${type||'task'}')">＋ Cadastrar</button></div>${itemsHtml(a)||'<p class="muted">Nenhum registro cadastrado.</p>'}</div>`}
if(tab==='Configurações'){v=`<div class="panel settings"><h2>Configurações</h2><p><b>Sincronização:</b> <span id="syncDescription">Os registros ficam salvos neste navegador até conectar o Firebase.</span></p><div class="row"><button class="primary" id="loginBtn" onclick="window.firebaseLogin?.()">Entrar com Google</button><button class="secondary" id="logoutBtn" onclick="window.firebaseLogout?.()">Sair</button></div><p class="muted">Para sincronizar entre aparelhos, configure um projeto Firebase no código, com Authentication e Firestore habilitados.</p><hr><label class="row"><input type="checkbox" style="width:auto" ${voiceEnabled?'checked':''} onchange="voiceEnabled=this.checked;localStorage.setItem('va-voice',voiceEnabled?'1':'0')"> Ler respostas em voz alta</label><p><button class="secondary" onclick="requestNotifications()">🔔 Permitir avisos com o app aberto</button></p><div id="pushState" class="setup">No plano gratuito e sem servidor de agendamento, o aplicativo não consegue enviar avisos garantidos quando está fechado.</div><div class="notice">Avisos locais funcionam enquanto o aplicativo está aberto. Com o aplicativo fechado, não há envio agendado nesta versão. Para medicamentos e compromissos essenciais, mantenha também um alarme do celular.</div><p><button class="secondary" onclick="exportData()">Exportar cópia dos dados</button></p></div>`}
document.getElementById('view').innerHTML=v;let st=document.getElementById('status');st.textContent=window.cloudUser?'☁️ Sincronizado':'Modo local';if(tab==='Configurações'&&window.cloudUser)document.getElementById('syncDescription').textContent='Conectado como '+window.cloudUser.email}
function itemsHtml(a){return a.map(i=>`<div class="item"><div><div><b>${categoryIcon(i.type)} ${safe(i.title)}</b> ${i.done?'<span class="pill">Concluído</span>':''}</div><div class="muted">${i.date.split('-').reverse().join('/')} ${safe(i.time)} ${i.repeat!=='none'?'· '+(i.repeat==='daily'?'Todos os dias':'Toda semana'):''}${Array.isArray(i.alerts)&&i.alerts.length?' · 🔔 '+i.alerts.length+' aviso(s)':''}</div>${i.detail?`<div>${safe(i.detail)}</div>`:''}</div><div class="row"><button class="secondary" onclick="editItem('${i.id}')">Editar</button><button class="secondary" onclick="markDone('${i.id}')">${i.done?'Reabrir':'Concluir'}</button><button class="secondary danger" onclick="deleteItem('${i.id}')">Excluir</button></div></div>`).join('')}
function formHtml(i={}){return `<form onsubmit="submitItem(event,'${i.id||''}')"><div class="formgrid"><label class="field wide">O que deseja lembrar?<input name="title" required maxlength="180" value="${safe(i.title||'')}" placeholder="Ex.: Consulta, tomar medicamento, pagar conta"></label><label class="field">Categoria<select name="type">${[['event','Compromisso'],['task','Lembrete / tarefa'],['med','Medicamento'],['note','Anotação']].map(([k,n])=>`<option value="${k}" ${i.type===k?'selected':''}>${n}</option>`).join('')}</select></label><label class="field">Data<input name="date" type="date" required value="${i.date||today()}"></label><label class="field">Horário<input name="time" type="time" required value="${i.time||'09:00'}"></label><label class="field">Repetição<select name="repeat">${[['none','Não repetir'],['daily','Todos os dias'],['weekly','Toda semana']].map(([k,n])=>`<option value="${k}" ${i.repeat===k?'selected':''}>${n}</option>`).join('')}</select></label><label class="field wide">Observações<textarea name="detail" placeholder="Detalhes opcionais">${safe(i.detail||'')}</textarea></label></div><div class="row"><button class="primary">Salvar na agenda</button>${i.id?'<button type="button" class="secondary" onclick="render()">Cancelar</button>':''}</div></form>`}
function newItem(type='event'){tab='Agenda';document.getElementById('view').innerHTML=`<div class="panel"><h2>Novo cadastro</h2>${formHtml({type})}</div>`}
function editItem(id){let i=dbData.items.find(x=>x.id===id);if(i)document.getElementById('view').innerHTML=`<div class="panel"><h2>Editar registro</h2>${formHtml(i)}</div>`}
function submitItem(e,id){e.preventDefault();let f=new FormData(e.target),item={id:id||uid(),title:String(f.get('title')).trim(),type:f.get('type'),date:f.get('date'),time:f.get('time'),repeat:f.get('repeat'),detail:String(f.get('detail')),done:false,alerts:[]};if(!item.title)return;let idx=dbData.items.findIndex(x=>x.id===id);if(idx>=0){item.done=dbData.items[idx].done;item.alerts=dbData.items[idx].alerts||[];dbData.items[idx]=item;}else dbData.items.push(item);save();tab='Agenda';render();toast('Registro salvo na agenda!')}
function deleteItem(id){if(!confirm('Excluir este registro?'))return;dbData.items=dbData.items.filter(x=>x.id!==id);save()}
function markDone(id){let i=dbData.items.find(x=>x.id===id);if(i){i.done=!i.done;save()}}
function toast(s){let el=document.getElementById('toast');el.textContent=s;el.style.display='block';setTimeout(()=>el.style.display='none',4500)}
function speak(s){if(voiceEnabled&&'speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='pt-BR';speechSynthesis.speak(u)}}
function addBubble(s,who){let c=document.getElementById('chat');if(!c)return;let d=document.createElement('div');d.className='bubble '+who;d.textContent=s;c.appendChild(d);c.scrollTop=c.scrollHeight}
function dayFromWord(s){let d=new Date();if(/depois de amanh[ãa]/.test(s))d.setDate(d.getDate()+2);else if(/amanh[ãa]/.test(s))d.setDate(d.getDate()+1);return localDate(d)}
function parseCommand(raw){
 const s=raw.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
 if(/o que (tenho|tem)|minha agenda|meus compromissos|meus lembretes|quais.*(hoje|amanha)/.test(s))return {query:true,date:dayFromWord(s)};
 if(!/lembra|lembrete|agenda|marca|cadastra|anota|tenho|tomar|remedio|medicamento|consulta|reuniao|compromisso|exame/.test(s))return {unknown:true};
 const months={janeiro:1,fevereiro:2,marco:3,abril:4,maio:5,junho:6,julho:7,agosto:8,setembro:9,outubro:10,novembro:11,dezembro:12};
 let date=dayFromWord(s), dmatch=s.match(/\b(?:dia\s*)?(\d{1,2})[\/-](\d{1,2})(?:[\/-](\d{2,4}))?\b/), named=s.match(/\b(?:dia\s*)?(\d{1,2})\s+de\s+(janeiro|fevereiro|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)(?:\s+de\s+(\d{4}))?/);
 let dayOnly=!dmatch&&!named?s.match(/\bdia\s+(\d{1,2})\b/):null;
 if(dmatch||named||dayOnly){let d=new Date(),day=Number((dmatch||named||dayOnly)[1]),month=dmatch?Number(dmatch[2]):named?months[named[2]]:d.getMonth()+1,year=Number((dmatch&&dmatch[3])||(named&&named[3])||d.getFullYear());if(year<100)year+=2000;let proposed=new Date(year,month-1,day,12);if(proposed.getDate()!==day||proposed.getMonth()!==month-1)return {error:'Essa data não existe. Pode conferir?'};if(!(dmatch&&dmatch[3])&&!(named&&named[3])&&proposed<new Date(today()+'T00:00:00')){if(dayOnly){proposed.setMonth(proposed.getMonth()+1);if(proposed.getDate()!==day)return {error:'Confirme o mês do compromisso.'}}else proposed.setFullYear(proposed.getFullYear()+1)}date=localDate(proposed)}
 // O primeiro horário é o compromisso. Horários após "me lembre" são avisos.
 let cut=s.search(/\b(?:me\s+)?(?:lembre|lembra|avise|avisa)\b/);if(cut>=0&&cut<18)cut=s.search(/\b(?:e\s+)?(?:me\s+)?(?:lembre|lembra|avise|avisa)\b/g,cut+12);
 const hours=[...s.matchAll(/\b(?:as|a)\s*(\d{1,2})(?:[:h](\d{2}))?\s*(?:horas?|h)?\b/g)].filter(m=>Number(m[1])<=23&&Number(m[2]||0)<=59);
 if(!hours.length)return {error:'Qual é o horário do compromisso? Informe a data e o horário para eu cadastrar corretamente.'};
 let time=pad(Number(hours[0][1]))+':'+pad(Number(hours[0][2]||0));
 let event=new Date(date+'T'+time+':00'),alerts=[];
 const add=(dt)=>{if(Number.isFinite(dt.getTime())&&dt.getTime()>Date.now()&&!alerts.some(a=>a.getTime()===dt.getTime()))alerts.push(dt)};
 let beforeDay=/\b(um|1|dois|2|tres|3)\s+dias?\s+antes/.exec(s);if(beforeDay){let n={um:1,dois:2,tres:3}[beforeDay[1]]||Number(beforeDay[1]);add(new Date(event.getTime()-n*86400000))}
 let beforeHour=/\b(uma|um|1|duas|dois|2|tres|3|\d+)\s+horas?\s+antes/.exec(s);if(beforeHour){let n={uma:1,um:1,duas:2,dois:2,tres:3}[beforeHour[1]]||Number(beforeHour[1]);add(new Date(event.getTime()-n*3600000))}
 if(/\bme lembre|\bme lembra|\bme avise|\bme avisa/.test(s)){
  for(const m of hours.slice(1)){let h=Number(m[1]),mi=Number(m[2]||0),dt=new Date(date+'T'+pad(h)+':'+pad(mi)+':00');if(dt>event)dt.setDate(dt.getDate()-1);add(dt)}
 }
 if(!alerts.length)add(event);
 let title=raw.split(/[,.;]|\s+(?:me lembre|me lembra|me avise|me avisa|e depois me)/i)[0].replace(/^(me\s+)?(lembra|lembre|agende|agenda|marca|marque|cadastra|cadastre|anota|anote)(-me)?\s*(de|que|para)?\s*/i,'').replace(/\b(amanhã|hoje|depois de amanhã)\b/gi,'').replace(/\b(?:dia\s*)?\d{1,2}[\/-]\d{1,2}(?:[\/-]\d{2,4})?\b/gi,'').replace(/\bdia\s+\d{1,2}\b/gi,'').replace(/\b\d{1,2}\s+de\s+(janeiro|fevereiro|março|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)(?:\s+de\s+\d{4})?/gi,'').replace(/\b(?:às|as)\s*\d{1,2}(?:[:h]\d{2})?\s*(?:horas?)?/gi,'').trim().replace(/\s+(?:tal|no|em|para|às|as|a|dia|de)\s*$/i,'').trim();
 if(!title)return {error:'O que devo registrar? Diga o compromisso, a data e o horário.'};
 return {create:true,item:{title,date,time,alerts:alerts.sort((a,b)=>a-b).slice(0,12).map(a=>a.toISOString()),repeat:/todo dia|todos os dias|diariamente/.test(s)?'daily':/toda semana|semanalmente/.test(s)?'weekly':'none',type:/remedio|medicamento|comprimido/i.test(s)?'med':'event',detail:'Cadastrado pela conversa'}};
}
async function sendChat(e){e.preventDefault();let inp=document.getElementById('chatText'),raw=inp.value.trim();if(!raw||aiBusy)return;inp.value='';addBubble(raw,'me');if(pendingDraft){let p=pendingDraft;pendingDraft=null;if(/^(sim|confirmo|pode salvar|salvar|ok|isso|correto)$/i.test(raw)){commitDraft(p);return}if(/^(nao|não|cancelar|cancela)$/i.test(raw)){addBubble('Tudo bem, não salvei o compromisso.','bot');speak('Tudo bem, não salvei.');return}addBubble('Para confirmar, diga “sim”. Para cancelar, diga “não”. Ou faça um novo pedido após cancelar.','bot');pendingDraft=p;return}if(APP_CONFIG.functionsBase&&window.cloudUser){await intelligentChat(raw);return}let cmd=parseCommand(raw),answer='';

function commitDraft(p){const item={id:uid(),title:String(p.title||'').slice(0,180),date:p.date,time:p.time||'09:00',type:['event','med','task','note'].includes(p.type)?p.type:'event',repeat:['none','daily','weekly'].includes(p.repeat)?p.repeat:'none',detail:String(p.detail||''),done:false,alerts:Array.isArray(p.alerts)?p.alerts:[]};dbData.items.push(item);save();let msg='Salvei '+item.title+' na agenda com '+item.alerts.length+' aviso(s) registrado(s). Os avisos só serão exibidos com o aplicativo aberto nesta versão.';addBubble(msg,'bot');speak(msg)}
function validDraft(p){if(!p||typeof p.title!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(p.date)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(p.time))return false;let d=new Date(p.date+'T12:00:00');if(isNaN(d)||localDate(d)!==p.date)return false;return Array.isArray(p.alerts)&&p.alerts.length<=12&&p.alerts.every(x=>typeof x==='string'&&!isNaN(Date.parse(x))&&/Z$|[+-]\d\d:\d\d$/.test(x))}

const notified=new Set();function checkDue(){let d=now(),minute=Math.floor(d.getTime()/60000);for(let i of dbData.items){if(i.done)continue;let due=(Array.isArray(i.alerts)&&i.alerts.length?i.alerts:[i.date+'T'+i.time+':00']);for(let alert of due){let stamp=i.id+':'+alert;if(notified.has(stamp))continue;let at=Date.parse(alert);if(Number.isFinite(at)&&Math.floor(at/60000)===minute){notified.add(stamp);toast('🔔 '+i.title);if('Notification'in window&&Notification.permission==='granted')new Notification('Velotec Assistente',{body:i.title});}}}}
voiceEnabled=localStorage.getItem('va-voice')==='1';render();setInterval(checkDue,15000);
